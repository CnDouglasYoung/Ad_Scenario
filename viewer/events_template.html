<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">

<title>调用链阅读器</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:#24352f;background:#f6f8f6;--green:#1d6951;--muted:#718179;--line:#dfe7e1;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,.file-button{cursor:pointer}button,.file-button{border:1px solid var(--line);background:#fff;color:#324c40;border-radius:8px;padding:7px 12px}button:hover,.file-button:hover{border-color:#85ae98;background:#f1f7f2}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #8fcab0;outline-offset:3px}a{color:var(--green)}
header{position:sticky;top:0;z-index:5;background:#f6f8f6f5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top{display:flex;align-items:center;gap:18px;padding:20px 30px 12px}.brand{font-size:18px;font-weight:750;white-space:nowrap}.brand span{color:var(--green);margin-right:9px}.subtitle{color:var(--muted);font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.file-button{font-size:12px;white-space:nowrap}#file{position:absolute;opacity:0;width:1px;height:1px}.stats{display:flex;gap:28px;flex-wrap:wrap;padding:0 30px 17px;font-size:12px;color:var(--muted)}.stats b{font:600 20px var(--mono);color:#294f3c;margin-right:6px}.layout{display:grid;grid-template-columns:228px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:26px 20px;position:sticky;top:130px;height:calc(100vh - 130px);overflow:auto;border-right:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0 0 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;border-color:transparent;display:flex;align-items:center;justify-content:space-between;padding:10px 12px}.nav button.active{color:var(--green);background:#e7efe9;border-color:#d6e4da;font-weight:650}.nav small{color:var(--muted);font:11px var(--mono)}.side-note{margin-top:28px;padding:16px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}kbd{font:11px var(--mono);border:1px solid #cdd9d0;border-radius:3px;padding:1px 4px;background:#fff}.side-note p{margin:8px 0}.main{min-width:0;padding:25px 34px 80px}.heading{display:flex;justify-content:space-between;align-items:start;gap:16px}h1{font-size:25px;letter-spacing:-.5px;margin:0 0 2px}.description{font-size:12px;color:var(--muted);margin:0 0 22px}.score-link{font-size:12px;white-space:nowrap}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.search{position:relative;flex:1;min-width:210px}.search input{width:100%;padding:9px 13px;border:1px solid #cfdcd2;border-radius:8px;background:white;color:#263d31}.toolbar select{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#364c40}.mode{display:flex;border:1px solid var(--line);border-radius:8px;background:white;padding:3px}.mode button{border:0;padding:5px 11px;font-size:12px}.mode button.active{background:#e6efe9;color:#18583d;font-weight:650}.subbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin:12px 0 20px;font-size:12px;color:var(--muted);flex-wrap:wrap}.subbar label{display:flex;align-items:center;gap:6px}.actions{display:flex;gap:7px}.actions button{font-size:11px;padding:4px 9px}.warning{border:1px solid #e9c991;background:#fff6e5;border-radius:8px;padding:12px 16px;color:#865b19;font-size:13px;margin:14px 0}.error{background:#fff1ef;color:#a73b2a;border-color:#ebc3bb}.hidden{display:none!important}.day-heading{display:flex;align-items:center;gap:12px;margin:27px 0 16px}.day-heading h2{font-size:15px;margin:0;white-space:nowrap}.day-heading span{color:var(--muted);font:11px var(--mono)}.day-heading:after{content:"";height:1px;background:var(--line);flex:1}.card{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 14px 20px;scroll-margin-top:150px;min-width:0;box-shadow:0 2px 3px #203d2c03}.card:before{content:"";position:absolute;left:-22px;top:24px;width:7px;height:7px;border-radius:50%;background:#9bb6a5;box-shadow:0 0 0 4px #f6f8f6}.card:after{content:"";position:absolute;left:-19px;top:36px;bottom:-19px;width:1px;background:var(--line)}.card:last-child:after{display:none}.card.tool:before{background:#228061}.card.thinking:before{background:#a89b7c}.card.verifier:before{background:#6690c4}.card.system{background:#f9fbf9}.card.focused{outline:2px solid #42986d;box-shadow:0 0 0 5px #e3eee6}.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #edf1ed;min-width:0}.badge{font-size:10px;letter-spacing:.3px;font-weight:650;color:#60776b;background:#edf2ef;padding:3px 7px;border-radius:5px;white-space:nowrap}.tool .badge{color:#1c6c4c;background:#e5f3eb}.thinking .badge{color:#8a7146;background:#f6f1e7}.verifier .badge{color:#4e7199;background:#eaf1fa}.card-title{font-size:13px;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}.sequence{font:10px var(--mono);color:#788b7f;text-decoration:none;white-space:nowrap}.status{font:10px var(--mono);color:#487b58;white-space:nowrap}.status.bad{color:#ad5639}.card-body{padding:14px 16px}.meta{font:10px/1.6 var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-bottom:10px}.content{font:12px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;margin:0;color:#33443a}.prose{font-family:inherit;font-size:13px;line-height:1.9}.block{margin:12px 0 0}.block:first-child{margin-top:0}summary{cursor:pointer;font-size:12px;color:#5c7265;padding:5px 0;overflow-wrap:anywhere}.block .content{background:#f6f8f6;border:1px solid #e8eee8;border-radius:6px;padding:12px;margin-top:5px}.body-actions{display:flex;justify-content:flex-end;margin-top:9px}.copy{font-size:10px;color:var(--muted);padding:3px 8px}.preview{max-height:120px;overflow:hidden;mask-image:linear-gradient(#000 70%,transparent)}.long-toggle{border:0;padding:5px 0;color:var(--green);font-size:11px;background:transparent}.long-toggle:hover{background:transparent}.empty{padding:65px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#3f5849;font-size:16px;margin-bottom:7px}#drop-overlay{position:fixed;inset:0;z-index:30;background:#e6f2ebee;border:5px dashed #558b68;display:grid;place-content:center;text-align:center;font-size:24px;color:#255f3b;pointer-events:none}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#254e3b;color:white;padding:9px 20px;border-radius:9px;z-index:40;font-size:12px}.result-label{display:flex;gap:10px;align-items:center}.matched{color:#8c6a1c}.mobile-top{display:none}.raw-type{font:12px var(--mono)}
@media(min-width:1500px){.main{padding-right:75px;padding-left:48px}}@media(max-width:850px){.top{padding:16px 18px 10px;gap:10px}.subtitle{display:none}.file-button{margin-left:auto}.stats{padding:0 18px 12px;gap:14px}.stats b{font-size:16px}.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;padding:14px 18px 0}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;gap:10px;padding:6px 10px}.side-note,aside .eyebrow{display:none}.main{padding:18px 18px 55px}.heading h1{font-size:22px}.toolbar{gap:7px}.search{flex-basis:100%}.subbar{gap:9px}.card{margin-left:12px}.card:before{left:-16px}.card:after{left:-13px}.card-head{gap:6px;flex-wrap:wrap;padding:11px 12px}.card-body{padding:12px}.status{white-space:normal}.card{scroll-margin-top:135px}}
.heading-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:420px}.translate-primary{background:#1d6951;color:white;border-color:#1d6951;font-size:12px}.translate-primary:hover{background:#18563f;color:white}.translation-controls{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.translation-controls button{font-size:11px;padding:3px 9px}.translation-label{font-size:11px;color:#8a7146;margin-right:auto}.translation-error{font-size:12px;color:#a74a32;margin-top:8px}.translation-bar{display:flex;align-items:center;gap:12px;background:#ecf4ee;border:1px solid #d3e4d8;border-radius:8px;margin:8px 0 18px;padding:10px 13px;font-size:12px;color:#456a51}.translation-bar span{flex:1}.translation-bar button{font-size:11px;padding:3px 8px}button:disabled{cursor:default;opacity:.6}.translation-note{font-size:11px;color:var(--muted);margin:0 0 16px}@media(max-width:600px){.heading{flex-direction:column}.heading-actions{justify-content:flex-start;max-width:100%;margin-bottom:14px}.heading .description{margin-bottom:8px}}
.file-switcher{display:flex;gap:10px;align-items:center;padding:0 30px 14px}.file-switcher label{font-size:12px;color:var(--muted);white-space:nowrap}.file-switcher select{flex:1;min-width:0;max-width:780px;padding:7px 10px;border:1px solid #cfdcd2;border-radius:7px;background:white;color:#324c40;font-size:12px;text-overflow:ellipsis}.file-switcher button{font-size:11px;white-space:nowrap;padding:6px 10px}#file-status{color:var(--muted);font-size:11px;white-space:nowrap}aside{top:var(--header-height,170px);height:calc(100vh - var(--header-height,170px))}.card{scroll-margin-top:calc(var(--header-height,170px) + 16px)}@media(max-width:850px){.file-switcher{padding:0 18px 12px;flex-wrap:wrap;gap:7px}.file-switcher select{max-width:none}.file-switcher label{display:none}#file-status{flex-basis:100%}aside{height:auto}.top .file-button{padding:6px 9px}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand"><span>◈</span>调用链阅读器</div><div id="source" class="subtitle"></div><button id="open-file" class="file-button">导入 JSONL 文件</button><input id="file" type="file" multiple accept=".jsonl,.json,.ndjson,text/plain,application/json"></div>
  <div class="file-switcher"><label for="file-select">事件文件</label><select id="file-select" aria-label="切换 JSONL 文件"></select><button id="refresh-files" title="重新查找目录中的事件文件">刷新列表</button><span id="file-status" role="status"></span></div>
  <div class="stats" id="stats"></div>
</header>
<div class="layout">
  <aside><p class="eyebrow">Run navigation</p><nav class="nav" id="days" aria-label="日期导航"></nav><div class="side-note"><p>按原始顺序串起<br>指令 → 思考 → 调用 → 返回 → 验收</p><p>调用与返回按 callId 配对。<br>所有内容都可完整展开。</p><p><kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 清除搜索<br><kbd>j</kbd> / <kbd>k</kbd> 下 / 上一张卡片</p><p>可拖入其他事件文件。<br>离线阅读，数据留在本机。</p></div></aside>
  <main class="main">
    <div class="heading"><div><p class="eyebrow">Execution trace</p><h1 id="title">完整调用链</h1><p id="description" class="description"></p></div><div class="heading-actions"><button id="translate-all" class="translate-primary">翻译全部思考</button><button id="toggle-original" class="score-link hidden">全部显示原文</button><button class="score-link" id="jump-score">查看最终评分 ↗</button></div></div>
    <div class="toolbar">
      <div class="search"><input type="search" id="search" placeholder="搜索全文、命令、callId 或 #序号…" aria-label="搜索完整事件内容"></div>
      <select id="kind" aria-label="事件类型"><option value="all">全部类型</option><option value="instruction">任务指令</option><option value="thinking">思考过程</option><option value="tool">工具调用与返回</option><option value="text">模型回复</option><option value="verifier">验收与评分</option><option value="system">状态与其他</option></select>
      <div class="mode" role="group" aria-label="阅读模式"><button id="chain" class="active" aria-pressed="true">调用链</button><button id="raw" aria-pressed="false">原始事件</button></div>
    </div>
    <div class="subbar"><label><input type="checkbox" id="show-system">显示状态与会话事件</label><span id="count" aria-live="polite"></span><div class="actions"><button id="expand">全部展开</button><button id="collapse">收起详情</button><button id="reset">重置筛选</button></div></div>
    <div id="translation-progress" class="translation-bar hidden" role="status"><span id="translation-progress-text"></span><button id="stop-translation" class="hidden">停止后续翻译</button></div>
    <p class="translation-note" id="translation-note">Google 翻译 · 仅发送思考原文，译文缓存在本机；已有译文可离线阅读。</p>
    <div id="error" class="warning error hidden" role="alert"></div>
    <div id="warning" class="warning hidden"></div>
    <div id="timeline"></div>
  </main>
</div>
<div id="drop-overlay" class="hidden">松开以读取 JSONL 文件</div><div id="toast" class="hidden" role="status"></div>

</html>
